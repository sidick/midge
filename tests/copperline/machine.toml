# Copperline machine profile for midge's headless on-target codec smoke
# test. A 68020 (midge's baseline per CLAUDE.md), 2 MB — plenty for the
# codec self-test.
#
# run.sh boots via `--run`/`--exit-on-return`, which supplies its own
# RunBoot:/RunProg: volumes - no [[filesys]]/[floppy] boot volume needed
# here. The Kickstart ROM is passed as a positional CLI arg (which
# overrides `rom` here), so this file stays portable across machines. See
# ../../Makefile `test-target` and ./run.sh.
[cpu]
model = "68020"

[memory]
chip = "1M"
fast = "1M"

[emulation]
power_on = true
warp_speed = "max" # boot + run as fast as the host allows; this is a batch test
