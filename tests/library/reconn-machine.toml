# Copperline machine profile for midge's on-target mqtt.library
# reconnect/backoff smoke test. Identical to net-machine.toml (68020, fast
# RAM, HostSocket board so the guest's bsdsocket.library reaches a real
# host-side broker) except the boot volume path, which points at
# ./reconnsys (that one stages libnet + mqtt.library for the plain
# end-to-end API test; this one stages libreconn + mqtt.library for the
# auto-reconnect test - see reconn-run.sh).
[cpu]
model = "68020"

[memory]
chip = "1M"
fast = "8M"

[floppy]
drives = 1 # DF0 wired but left empty; we boot from a host directory

# Boot straight from a host directory - a separate tree from
# tests/library/sys and tests/library/netsys (see reconn-run.sh).
[[filesys]]
path = "reconnsys"
volume = "MidgeLibReconnTest"
bootpri = 10

[hostsocket]
net = "host"

[emulation]
power_on = true
warp_speed = "max"
