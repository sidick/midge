# User documentation site (MkDocs Material), published per release via mike
# to GitHub Pages — see .github/workflows/docs.yml. Developer design notes
# stay in docs/ and are not part of this site.

site_name: midge
site_description: A native MQTT 3.1.1 client for classic AmigaOS
site_url: https://sidick.github.io/midge/
repo_url: https://github.com/sidick/midge
repo_name: sidick/midge
edit_uri: edit/main/userdocs/
copyright: midge — a native MQTT client for classic AmigaOS. BSD 2-Clause.

docs_dir: userdocs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.action.edit

extra:
  version:
    provider: mike

markdown_extensions:
  - toc:
      permalink: true

nav:
  - Home: index.md
  - CLI Reference: CLI-Reference.md
